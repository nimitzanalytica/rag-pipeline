services:
  api:
    build: .
    container_name: rag-api
    ports:
      - "8000:8000"

    # Load ANTHROPIC_API_KEY (and any overrides) from your .env file
    env_file:
      - .env

    # Mount data directories so ChromaDB and uploads persist across restarts
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./uploads:/app/uploads

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
